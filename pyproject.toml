[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subscription-gateway"
version = "0.1.0"
description = "Local Chat Completions gateway for ChatGPT plan usage"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "openai>=1.70,<3", "ruff>=0.11,<1"]

[project.scripts]
subscription-gateway = "subscription_gateway.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/subscription_gateway"]
